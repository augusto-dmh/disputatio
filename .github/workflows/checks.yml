name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Repo constraint (PR #7): no hashFiles job-ifs, no unproven third-party action
  # refs — both break workflow expansion on this repository.
  fitness:
    name: fitness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: fitness (architecture boundaries)
        run: python3 scripts/fitness.py
      - name: markdownlint
        run: npx -y markdownlint-cli2 "**/*.md"
      - name: compose config
        run: docker compose -f docker/docker-compose.yml config --quiet
        env:
          POSTGRES_PASSWORD: ci-placeholder

  conventional-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: conventional PR title
        run: |
          title=$(jq -r '.pull_request.title' "$GITHUB_EVENT_PATH")
          echo "PR title: $title"
          printf '%s' "$title" | grep -qE '^(feat|fix|docs|chore|refactor|test|perf|build|ci|style|revert)(\([^)]+\))?!?: .{1,100}$' || {
            echo "::error::PR title must be conventional: 'type(scope?): summary' (feat|fix|docs|chore|refactor|test|perf|build|ci|style|revert)"
            exit 1
          }

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: install pnpm
        run: npm i -g pnpm@10
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome check .
      - run: pnpm vitest run
      - run: pnpm build

  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: add rustfmt and clippy
        run: rustup component add rustfmt clippy
      # first-party action (PR #7 constraint); Cargo.lock is not committed, so
      # the key hashes Cargo.toml and restore-keys salvage stale artifacts
      - name: cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-
      - run: cargo fmt --all -- --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
