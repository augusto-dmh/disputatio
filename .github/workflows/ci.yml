name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  fitness:
    name: fitness & docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: fitness (architecture boundaries)
        run: python3 scripts/fitness.py
      - name: markdownlint
        run: npx -y markdownlint-cli2 "**/*.md"
      - name: compose config
        run: docker compose -f docker/docker-compose.yml config --quiet
        env:
          POSTGRES_PASSWORD: ci-placeholder

  conventional-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: [feat, fix, docs, chore, refactor, test, perf, build, ci, style, revert]

  # Activate when slice 0.1 lands the Rust workspace (AGENTS.md: CI mirrors the Makefile vocabulary)
  rust:
    if: hashFiles('**/Cargo.toml') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

  # Activate when slice 0.1 lands the frontend (+ .nvmrc)
  frontend:
    if: hashFiles('src/**') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npx -y biome check .
      - run: npx -y tsc --noEmit
      - run: npx -y vitest run
