[package]
name = "disputatio"
version = "0.1.0"
description = "Local-first desktop study environment: daily queue, FSRS memory, voice narration, disputation."
authors = ["augusto-dmh"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "disputatio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["tls-rustls", "postgres", "macros", "migrate", "chrono", "runtime-tokio"] }
async-trait = "0.1"
dotenvy = "0.15"
# Timestamps: the stale rule (14 days) and session durations (tasks 5–8);
# `sqlx` already speaks this crate for TIMESTAMPTZ.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# IPC bindings (ADR 0009 — tauri-specta RC, accepted knowingly; exact pins as
# the tauri-specta docs require for the RC line).
specta = { version = "=2.0.0-rc.25", features = ["derive", "function"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rs-fsrs = "1.2"

[dev-dependencies]
testcontainers = "0.24"
testcontainers-modules = { version = "0.12", features = ["postgres"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
